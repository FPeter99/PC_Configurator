<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Összeállító</title>
    <link rel="stylesheet" href="src/assets/app.css">
</head>
<body>

<header>
  <button id="menu-toggle">☰</button>
  <h1>PC Összeállító</h1>
  <p>Válassz alkatrészt kategóriánként.</p>
</header>

<div class="layout">
    <nav id="cat-nav">
        <button class="nav-btn active" data-part-type="processors">
            <svg class="nav-icon" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1"/><path d="M9 3v4M15 3v4M9 17v4M15 17v4M3 9h4M3 15h4M17 9h4M17 15h4"/></svg>
            Processzor
            <span class="dot"></span>
        </button>

        <button class="nav-btn" data-part-type="motherboards">
            <svg class="nav-icon" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="8" y="8" width="4" height="4"/><path d="M15 8v8M8 16h4"/></svg>
            Alaplap
            <span class="dot"></span>
        </button>

        <button class="nav-btn" data-part-type="ram">
            <svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="8" rx="1"/><path d="M7 8v8M11 8v8M15 8v8M6 16v3M10 16v3M14 16v3M18 16v3"/></svg>
            Memória
            <span class="dot"></span>
        </button>

        <button class="nav-btn" data-part-type="gpus">
            <svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="1"/><circle cx="9" cy="12" r="2.5"/><circle cx="16" cy="12" r="2.5"/><path d="M6 17v2"/></svg>
            Videokártya
            <span class="dot"></span>
        </button>

        <button class="nav-btn" data-part-type="storage">
            <svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="2"/><path d="M7 12h6M17 12h.01"/></svg>
            Tárhely
            <span class="dot"></span>
        </button>

        <button class="nav-btn" data-part-type="powerSupplies">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></svg>
            Tápegység
            <span class="dot"></span>
        </button>

        <button class="nav-btn" data-part-type="cases">
            <svg class="nav-icon" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M9 7h6M9 11h6M12 17h.01"/></svg>
            Ház
            <span class="dot"></span>
        </button>

        <button class="nav-btn" data-part-type="cpuCoolers">
            <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="1.5"/><path d="M12 10.5C12 7 13 5 15 5M13.5 12c3.5 0 5.5 1 5.5 3M12 13.5c0 3.5-1 5.5-3 5.5M10.5 12C7 12 5 11 5 9"/></svg>
            CPU hűtő
            <span class="dot"></span>
        </button>
    </nav>

  <main>
    <div class="section-header">
        <div class="search-sort-row">
            <input type="text" id="search-input" 
                    class="search-input" placeholder="Keresés">
            <select id="sort-select" class="sort-select">
                <option value="default">Rendezés</option>
                <option value="price-asc">Ár: alacsony → magas</option>
                <option value="price-desc">Ár: magas → alacsony</option>
            </select>
        </div>

        <div class="section-heading">
            <h2 id="section-title"></h2>
            <span id="section-count"></span>
        </div>
    </div>
    <div class="cards" id="cards"></div>
  </main>

  <aside>
    <h2>Konfiguráció</h2>
    <div class="sub">Kiválasztott alkatrészek</div>
    <div id="summary-list"></div>
    <div class="total-row">
      <span>Végösszeg</span>
      <span class="amount" id="total-amount">0 $</span>
    </div>
  </aside>
</div>

<!-- templatek -->

 <template id="processor-card-template">
    <div class="card">
        <h3 class="card-title"></h3>

        <div class="specs">
            <div class="row">
                <span>Gyártó</span>
                <span class="brand"></span>
            </div>

            <div class="row">
                <span>Foglalat</span>
                <span class="socket"></span>
            </div>

            <div class="row">
                <span>Magok</span>
                <span class="cores"></span>
            </div>

            <div class="row">
                <span>Szálak</span>
                <span class="threads"></span>
            </div>

            <div class="row">
                <span>Alap órajel</span>
                <span class="base-clock"></span>
            </div>

            <div class="row">
                <span>Boost órajel</span>
                <span class="boost-clock"></span>
            </div>

            <div class="row">
                <span>TDP</span>
                <span class="tdp"></span>
            </div>
        </div>

        <div class="price"></div>
    </div>
</template>

<template id="gpu-card-template">
    <div class="card">
        <h3 class="card-title"></h3>

        <div class="specs">
            <div class="row">
                <span>Gyártó</span>
                <span class="brand"></span>
            </div>

            <div class="row">
                <span>Interfész</span>
                <span class="interface"></span>
            </div>

            <div class="row">
                <span>VRAM</span>
                <span class="vram"></span>
            </div>

            <div class="row">
                <span>Memória típusa</span>
                <span class="memory-type"></span>
            </div>

            <div class="row">
                <span>TDP</span>
                <span class="tdp"></span>
            </div>
        </div>

        <div class="price"></div>
    </div>
</template>

<template id="motherboard-card-template">
    <div class="card">
        <h3 class="card-title"></h3>

        <div class="specs">
            <div class="row">
                <span>Gyártó</span>
                <span class="brand"></span>
            </div>

            <div class="row">
                <span>CPU foglalat</span>
                <span class="cpu-socket"></span>
            </div>

            <div class="row">
                <span>RAM típusa</span>
                <span class="ram-type"></span>
            </div>

            <div class="row">
                <span>Formátum</span>
                <span class="form-factor"></span>
            </div>
        </div>

        <div class="price"></div>
    </div>
</template>

<template id="ram-card-template">
    <div class="card">
        <h3 class="card-title"></h3>

        <div class="specs">
            <div class="row">
                <span>Gyártó</span>
                <span class="brand"></span>
            </div>

            <div class="row">
                <span>RAM típusa</span>
                <span class="ram-type"></span>
            </div>

            <div class="row">
                <span>Kapacitás</span>
                <span class="capacity"></span>
            </div>

            <div class="row">
                <span>Sebesség</span>
                <span class="speed"></span>
            </div>
        </div>

        <div class="price"></div>
    </div>
</template>

<template id="storage-card-template">
    <div class="card">
        <h3 class="card-title"></h3>

        <div class="specs">
            <div class="row">
                <span>Gyártó</span>
                <span class="brand"></span>
            </div>

            <div class="row">
                <span>Típus</span>
                <span class="storage-type"></span>
            </div>

            <div class="row">
                <span>Interfész</span>
                <span class="interface"></span>
            </div>

            <div class="row">
                <span>Kapacitás</span>
                <span class="capacity"></span>
            </div>
        </div>

        <div class="price"></div>
    </div>
</template>

<template id="power-supply-card-template">
    <div class="card">
        <h3 class="card-title"></h3>

        <div class="specs">
            <div class="row">
                <span>Gyártó</span>
                <span class="brand"></span>
            </div>

            <div class="row">
                <span>Teljesítmény</span>
                <span class="wattage"></span>
            </div>

            <div class="row">
                <span>Hatásfok</span>
                <span class="efficiency"></span>
            </div>
        </div>

        <div class="price"></div>
    </div>
</template>

<template id="case-card-template">
    <div class="card">
        <h3 class="card-title"></h3>

        <div class="specs">
            <div class="row">
                <span>Gyártó</span>
                <span class="brand"></span>
            </div>

            <div class="row">
                <span>Támogatott formátum</span>
                <span class="supported-form-factor"></span>
            </div>
        </div>

        <div class="price"></div>
    </div>
</template>

<template id="cpu-cooler-card-template">
    <div class="card">
        <h3 class="card-title"></h3>

        <div class="specs">
            <div class="row">
                <span>Gyártó</span>
                <span class="brand"></span>
            </div>

            <div class="row">
                <span>Támogatott foglalat</span>
                <span class="supported-sockets"></span>
            </div>
        </div>

        <div class="price"></div>
    </div>
</template>



<script type="module" src="src/main.js"></script>
</body>
</html>
